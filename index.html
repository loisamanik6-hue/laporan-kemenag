<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengumpulan Laporan Magang - Kemenag</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light container py-4">

    <div class="card p-4 shadow-sm my-3">
        <h4 class="text-center mb-3">Pengumpulan Laporan Magang Digital</h4>
        <p class="text-muted text-center">Bagian Kepegawaian Kanwil Kemenag</p>
        <hr>

        <form action="/simpan" method="POST">
            <div class="mb-3">
                <label class="form-label">Nama Lengkap</label>
                <input type="text" name="nama" class="form-control" placeholder="Masukkan nama Anda" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Asal Kampus / Sekolah</label>
                <input type="text" name="instansi" class="form-control" placeholder="Contoh: UIN / Unilak / SMKN" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Judul Laporan</label>
                <input type="text" name="judul" class="form-control" placeholder="Masukkan judul laporan" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Kirim Laporan</button>
        </form>
    </div>

    <div class="text-center mt-4">
        <a href="/admin" class="text-decoration-none text-muted" style="font-size: 12px;">[ Akses Admin Kepegawaian ]</a>
    </div>

</body>
</html>
